version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: splittab-postgres
    environment:
      POSTGRES_USER: splittab
      POSTGRES_PASSWORD: splittab_dev_password
      POSTGRES_DB: splittab_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U splittab']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: splittab-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API (Development)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splittab-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://splittab:splittab_dev_password@postgres:5432/splittab_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
